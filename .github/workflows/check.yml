name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain for scripts/check.conf (bootstrap): Python 3.14 + pinned dev tools.
      # scripts/py falls back to this `python` when there is no .venv (docs/conventions.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi

  # Known vulnerabilities in runtime dependencies (docs/security.md, Dependencies). Kept out of
  # scripts/check on purpose: it needs the network, and check must give the same answer everywhere.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
