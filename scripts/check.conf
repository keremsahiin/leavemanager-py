# scripts/check.conf — ./scripts/check'in adımları (docs/testing.md). Bootstrap üretti: 2026-10-25.
# Python araçları scripts/py ile çağrılır: .venv varsa onun Python'u, yoksa (CI) PATH'teki python.
#
# Kaynak envanteri (docs/testing.md, Resource hygiene):
# - ruff check / ruff format --check: tek süreç, işini bitirip çıkar; daemon, sunucu ve izleme
#   modu yok. Bir sonraki koşuya bıraktığı tek veri .ruff_cache; --no-cache ile o da yazılmaz.
# - pytest (spec 0001): worker (xdist) yok, sunucu yok (Flask test client aynı süreçte çalışır);
#   -p no:cacheprovider ile .pytest_cache yazılmaz; bellekteki uygulama durumu her testte yeniden
#   kurulur (tests/conftest.py); time-machine'in dondurduğu saat her testin sonunda geri alınır.
# - lint-imports (refactor spec'iyle eklenecek): tek süreç, cache yazmaz (--no-cache).
#
# Profiller: şu an yavaş adım yok, tüm adımlar [fast] (fast = full). İlk yavaş test geldiğinde
# test adımı pytest işaretiyle bölünür: -m "not slow" [fast] / -m slow (yalnızca full).

# resource hygiene: ruff bir kez çalışıp çıkar; --no-cache sonraki koşuya veri bırakmaz
lint [fast]: sh scripts/py -m ruff check --no-cache .
# resource hygiene: ruff bir kez çalışıp çıkar; --no-cache sonraki koşuya veri bırakmaz
format [fast]: sh scripts/py -m ruff format --check --no-cache .
# resource hygiene: süreç içi test client, worker yok; no:cacheprovider sonraki koşuya veri bırakmaz
test [fast]: sh scripts/py -m pytest -q -p no:cacheprovider
